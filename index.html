<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Subject To-Do Dashboard</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
/* ===================== BASE ===================== */
body {
    background: linear-gradient(135deg, #f5f6fa, #eef2ff);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    color: #111827;
}

h3 {
    font-weight: 700;
    letter-spacing: -0.5px;
}

/* ===================== CARDS ===================== */
.card {
    border-radius: 16px;
    border: none;
    box-shadow: 0 6px 20px rgba(0,0,0,0.06);
    transition: 0.2s ease;
}

.card:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

/* ===================== BUTTONS ===================== */
.btn {
    border-radius: 10px;
    font-weight: 500;
}

.btn-primary {
    background: linear-gradient(135deg, #4f46e5, #6366f1);
    border: none;
}

.btn-primary:hover {
    opacity: 0.92;
}

.btn-sm {
    padding: 6px 10px;
    font-size: 13px;
}

/* ===================== TASK UI ===================== */
.task-item {
    display: flex;
    flex-direction: column;
    padding: 10px;
    background: #f9fafb;
    border-radius: 10px;
    margin-bottom: 6px;
    gap: 4px;
}

.task-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.task-left {
    display: flex;
    align-items: center;
    gap: 8px;
}

.task-name {
    margin-left: 18px;
    font-size: 14px;
}

.task-meta {
    font-size: 12px;
    color: #6b7280;
    margin-left: 18px;
}

.task-done {
    text-decoration: line-through;
    color: #6b7280;
}

/* ===================== STATUS COLORS ===================== */
.status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
}

/* GREEN = COMPLETED */
.status-completed { background: #10b981; }

/* YELLOW = PENDING */
.status-pending { background: #f59e0b; }

/* RED = MISSING */
.status-missing { background: #ef4444; }

.status-text {
    font-size: 12px;
    font-weight: 600;
    color: #374151;
}

/* ===================== SUBJECT ===================== */
.subject-title {
    font-weight: 700;
    font-size: 15px;
}

.subject-stats {
    font-size: 12px;
    margin-top: 4px;
    color: #6b7280;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

.badge-soft {
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 999px;
}

.badge-pending { background: #fef3c7; color: #92400e; }
.badge-missing { background: #fee2e2; color: #991b1b; }

/* ===================== LAYOUT ===================== */
.container {
    max-width: 1200px;
}

/* ===================== CHART ===================== */
canvas {
    width: 100% !important;
    height: 100% !important;
}
</style>

</head>

<body>

<div class="container py-4">

  <h3 class="mb-4" style="color: #4f46e5;">📚 To-Do-List Dashboard</h3>
  <hr>

  <!-- HEADER -->
  <div class="d-flex w-100 gap-3 mb-4">

    <!-- CHART -->
    <div class="card p-3" style="flex:1;">
      <div style="display:flex; justify-content:center; align-items:center; height:220px;">
        <canvas id="statusChart"></canvas>
      </div>
    </div>

    <!-- STATS -->
    <div style="flex:1; display:flex; flex-direction:column; gap:10px;">

      <div class="card p-2 d-flex justify-content-between">
        <span>Total</span><strong id="total">0</strong>
      </div>

      <div class="card p-2 d-flex justify-content-between">
        <span>Completed</span><strong id="done" style="color:#10b981;">0</strong>
      </div>

      <div class="card p-2 d-flex justify-content-between">
        <span>Pending</span><strong id="pending" style="color:#f59e0b;">0</strong>
      </div>

      <div class="card p-2 d-flex justify-content-between">
        <span>Missing</span><strong id="missing" style="color:#ef4444;">0</strong>
      </div>

    </div>
  </div>

  <!-- ADD SUBJECT -->
  <div class="d-flex justify-content-end mb-3">
    <div class="card p-2 d-inline-flex">
      <button class="btn btn-sm btn-primary px-3" onclick="openSubjectModal()">+ Add Subject</button>
    </div>
  </div>

  <div id="tree"></div>

</div>

<!-- SUBJECT MODAL -->
<div class="modal fade" id="subjectModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5>Add Subject</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input id="subjectInput" class="form-control" placeholder="Subject name"/>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="confirmAddSubject()">Add</button>
      </div>
    </div>
  </div>
</div>

<!-- TASK MODAL -->
<div class="modal fade" id="taskModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5>Add Task</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input id="taskName" class="form-control mb-2" placeholder="Task name"/>
        <input id="taskDeadline" type="date" class="form-control mb-2"/>
        <textarea id="taskDesc" class="form-control" placeholder="Description"></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="confirmAddTask()">Add</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

let subjects = JSON.parse(localStorage.getItem('todoSubjects') || '[]');
let taskTarget = null;
let subjectModal, taskModal;
let statusChart;

/* ===================== MODALS ===================== */
function openSubjectModal(){
  document.getElementById('subjectInput').value='';
  subjectModal.show();
}

function confirmAddSubject(){
  const text=document.getElementById('subjectInput').value.trim();
  if(!text) return;

  subjects.push({id:Date.now(),title:text,tasks:[],expanded:true});
  persist();
  subjectModal.hide();
}

function openTaskModal(id){
  taskTarget=id;
  taskModal.show();
}

function confirmAddTask(){
  const name=document.getElementById('taskName').value.trim();
  const deadline=document.getElementById('taskDeadline').value;
  const desc=document.getElementById('taskDesc').value.trim();
  if(!name) return;

  findSubject(taskTarget).tasks.push({
    id:Date.now(),
    text:name,
    deadline,
    desc,
    done:false
  });

  persist();
  taskModal.hide();
}

/* ===================== CORE ===================== */
function findSubject(id){
  return subjects.find(s=>s.id===id);
}

function toggleTask(sid,tid){
  const t=findSubject(sid).tasks.find(x=>x.id===tid);
  t.done=!t.done;
  persist();
}

function deleteTask(sid,tid){
  const s=findSubject(sid);
  s.tasks=s.tasks.filter(t=>t.id!==tid);
  persist();
}

function toggleSubject(id){
  findSubject(id).expanded=!findSubject(id).expanded;
  persist();
}

function deleteSubject(id){
  subjects=subjects.filter(s=>s.id!==id);
  persist();
}

/* ===================== STATUS ===================== */
function getStatus(task,today){
  if(task.done) return "completed";
  if(task.deadline && task.deadline < today) return "missing";
  return "pending";
}

/* ===================== RENDER ===================== */
function render(){
  document.getElementById('tree').innerHTML = subjects.map(renderSubject).join('');

  const c = count();

  document.getElementById('total').innerText=c.total;
  document.getElementById('done').innerText=c.done;
  document.getElementById('pending').innerText=c.pending;
  document.getElementById('missing').innerText=c.missing;

  renderChart(c.done,c.pending,c.missing);
}

function renderSubject(s){
  const today=new Date().toISOString().split('T')[0];

  const pending=s.tasks.filter(t=>!t.done).length;
  const missing=s.tasks.filter(t=>!t.done && t.deadline && t.deadline<today).length;

  return `
  <div class="card p-3 mb-2">

    <div class="d-flex justify-content-between">
      <div>
        <div class="subject-title">📘 ${s.title}</div>
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-sm btn-primary" onclick="openTaskModal(${s.id})">+ Task</button>
        <button class="btn btn-sm btn-outline-dark" onclick="toggleSubject(${s.id})">
          ${s.expanded?'Hide':'Show'}
        </button>
        <button class="btn btn-sm btn-danger" onclick="deleteSubject(${s.id})">🗑</button>
      </div>
    </div>

    ${s.expanded ? s.tasks.map(t=>renderTask(s,t)).join('') : ''}

  </div>`;
}

function renderTask(s,t){
  const today=new Date().toISOString().split('T')[0];
  const status=getStatus(t,today);

  return `
  <div class="task-item">

    <div class="task-top">
      <div class="task-left">
        <span class="status-dot status-${status}"></span>
        <span class="status-text">${
          status==="completed"?"COMPLETED":
          status==="missing"?"MISSING":"PENDING"
        }</span>
      </div>

      <div>
        <button class="btn btn-sm btn-success" onclick="toggleTask(${s.id},${t.id})">✔</button>
        <button class="btn btn-sm btn-danger" onclick="deleteTask(${s.id},${t.id})">✖</button>
      </div>
    </div>

    <div class="task-name ${t.done?'task-done':''}">${t.text}</div>
    <div class="task-meta">
      ${t.deadline?'📅 '+t.deadline:''}
      ${t.desc?'<br>'+t.desc:''}
    </div>

  </div>`;
}

/* ===================== COUNTS ===================== */
function count(){
  let total=0,done=0,missing=0;
  const today=new Date().toISOString().split('T')[0];

  for(let s of subjects){
    for(let t of s.tasks){
      total++;
      if(t.done) done++;
      if(!t.done && t.deadline && t.deadline<today) missing++;
    }
  }

  return {total,done,pending:total-done,missing};
}

/* ===================== CHART ===================== */
function renderChart(done,pending,missing){
  const ctx=document.getElementById('statusChart');

  if(statusChart) statusChart.destroy();

  statusChart=new Chart(ctx,{
    type:'pie',
    data:{
      labels:['Completed','Pending','Missing'],
      datasets:[{
        data:[done,pending,missing],
        backgroundColor:[
          '#10b981',
          '#f59e0b',
          '#ef4444'
        ]
      }]
    },
    options:{
      maintainAspectRatio:false,
      plugins:{legend:{position:'bottom'}}
    }
  });
}

/* ===================== STORAGE ===================== */
function persist(){
  localStorage.setItem('todoSubjects',JSON.stringify(subjects));
  render();
}

/* ===================== INIT ===================== */
document.addEventListener('DOMContentLoaded',()=>{
  subjectModal=new bootstrap.Modal(document.getElementById('subjectModal'));
  taskModal=new bootstrap.Modal(document.getElementById('taskModal'));
  render();
});

</script>

</body>
</html>
